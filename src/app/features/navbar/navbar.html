
<div *ngIf="!isCustomerLoggedIn && !isAdminLoggedIn">
  <mat-toolbar color="primary" class="navbar">
    <span class="navbar-brand">Tejiendo Arte</span>
    <span class="spacer"></span>
    <button mat-button routerLink="/">Main</button>
    <button mat-button routerLink="/signup">Register</button>
    <button mat-button routerLink="/login">Login</button>
  </mat-toolbar>
</div>

<div *ngIf="isAdminLoggedIn">
  <mat-toolbar color="primary" class="navbar">
    <span class="navbar-brand">Tejiendo Arte</span>
    <span class="spacer"></span>
    <button mat-button routerLink="/admin/dashboard">Dashboard</button>
    <button mat-button routerLink="/admin/analytics">Analytics</button>
    <button mat-button routerLink="/admin/category">Category</button>
    <button mat-button routerLink="/admin/product">Product</button>
    <button mat-button routerLink="/admin/orders">Orders</button>
    <button mat-button routerLink="/admin/post-coupon">Post Coupon</button>
    <button mat-button routerLink="/admin/coupons">Coupons</button>
    <button mat-button routerLinkActive="active" (click)="logout()">Logout</button>
  </mat-toolbar>
</div>

<div *ngIf="isCustomerLoggedIn">
  <mat-toolbar color="primary" class="navbar">
    <span class="navbar-brand">Tejiendo Arte</span>
    <span class="spacer"></span>
    <button mat-button routerLink="/admin/dashboard">Dashboard</button>
    <button mat-button routerLink="/admin/cart">Cart</button>
    <button mat-button routerLink="/admin/my_orders">Orders</button>
    <button mat-button routerLink="/admin/wishlist">Wishlist</button>
    <button mat-button routerLink="/admin/profile">Profile</button>
    <button mat-button routerLinkActive="active" (click)="logout()">Logout</button>
</mat-toolbar>
</div>
