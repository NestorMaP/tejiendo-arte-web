<div class="product-list">

    <form [formGroup]="searchProductForm" class="search-form" (submit)="submitForm()">
        <mat-form-field appearance="outline" class="search-input"></mat-form-field>
        <mat-label>Enter Keyword to search</mat-label>
        <input matInput formControlName="title">

        <button mat-button matSuffix color="primary" [disabled]="searchProductForm.invalid">
            <mat-icon>search</mat-icon>
        </button>
    </form>

    @for (product of products; track product.id) {
        <mat-card class="product-card">
            <div class="product-image">
                <img [src]="product.processedImage" alt="product-image" />
            </div>

            <div class="product-details">
                <h2 class="product-name">{{ product.name }}</h2>
                <h2 class="product-description">{{ product.description }}</h2>

                <mat-divider></mat-divider>
                
                <div class="product-info">
                    <div class="info-row">
                        <span class="info-label">Price: </span>
                        <span class="info-value">{{ product.price }}€</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Category: </span>
                        <span class="info-value">{{ product.categoryName }}</span>
                    </div>
                </div>

                <mat-divider></mat-divider>
                <div class="actions">
                    <button mat-raised-button color="primary" class="update-button"
                    [routerLink]="'/admin/faq' + product.id">FAQ</button>
                    <button mat-raised-button color="accent" class="update-button"
                    [routerLink]="'/admin/product' + product.id">Update</button>
                    <button mat-raised-button color="warn" class="delete-button"
                    [routerLink]="'/admin/faq' + product.id">Delete</button>
                </div>
            </div>
        </mat-card>
    }
</div>
